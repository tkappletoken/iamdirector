<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'sha256-2k6izS2ILFZI8Wkk2oXSj2OWf8N9b7qhPcPVoqCK57M='">
<title>我是導演</title>
<style>
  :root{color-scheme:dark}
  body{margin:0;height:100vh;display:grid;place-items:center;background:#0b0b0f;color:#e8e8ee;font:15px/1.6 -apple-system,"PingFang TC","Microsoft JhengHei",sans-serif}
  .box{text-align:center;max-width:420px;padding:24px}
  h1{font-size:20px;margin:0 0 8px}
  p{color:#9a9aa8;margin:0 0 20px;word-break:break-all}
  button{background:#e8e8ee;color:#0b0b0f;border:0;border-radius:8px;padding:10px 22px;font:inherit;font-weight:600;cursor:pointer}
</style></head>
<body><div class="box">
  <h1>目前沒有網路連線</h1>
  <p id="d">請確認網路連線。連上後會自動回到剛才的頁面。</p>
  <button id="r">重試</button>
</div>
<!--params-->
<script>var q=JSON.parse(document.getElementById('params').textContent||'{}'),u=q.u||'';function go(){if(/^https?:\/\//.test(u))location.href=u;}if(q.d)document.getElementById('d').textContent='請確認網路連線。連上後會自動回到剛才的頁面。（'+q.d+'）';document.getElementById('r').onclick=go;window.addEventListener('online',go);</script>
</body></html>
