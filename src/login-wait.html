<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'sha256-JCHg6zoA67giqrCuFGOQfmSnV7A7A/Z+Z6W+9iZT8I0='">
<title>我是導演</title>
<style>
  :root{color-scheme:dark}
  body{margin:0;height:100vh;display:grid;place-items:center;background:#0b0b0f;color:#e8e8ee;font:15px/1.6 -apple-system,"PingFang TC","Microsoft JhengHei",sans-serif}
  .box{text-align:center;max-width:440px;padding:24px}
  h1{font-size:20px;margin:0 0 8px}
  p{color:#9a9aa8;margin:0 0 20px}
  .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  button{background:#e8e8ee;color:#0b0b0f;border:0;border-radius:8px;padding:10px 22px;font:inherit;font-weight:600;cursor:pointer}
  button.ghost{background:transparent;color:#e8e8ee;border:1px solid #3a3a46}
</style></head>
<body><div class="box">
  <h1 id="t">請在瀏覽器完成登入</h1>
  <p id="d">已經用你的瀏覽器開啟登入頁。完成後會自動回到「我是導演」。</p>
  <div class="row"><button id="o">重新開啟瀏覽器</button><button id="c" class="ghost">取消</button></div>
</div>
<!--params-->
<script>var q=JSON.parse(document.getElementById('params').textContent||'{}'),n={google:'Google',github:'GitHub',line:'LINE'}[q.p];if(n)document.getElementById('t').textContent='請在瀏覽器完成 '+n+' 登入';function go(k){var u=q[k]||'';if(/^https?:\/\//.test(u))location.href=u;}document.getElementById('o').onclick=function(){go('r');};document.getElementById('c').onclick=function(){go('u');};</script>
</body></html>
